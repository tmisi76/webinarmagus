<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Webinár Mágus telepítés</title><link rel="stylesheet" href="base.css"></head>
<body><div class="card">
  <div class="brand"><img src="../build/icon.png" alt=""><div><h1>Webinár Mágus</h1><p>Első indítás</p></div></div>
  <div class="status" id="installStatus">A háttérmotor még nincs telepítve.</div>
  <p>Macen a Webinár Mágus automatikusan fel tudja telepíteni a szükséges runtime-ot. A személyes beállításokat, AI API-kulcsot és AutoWebinar kapcsolatot ezután a grafikus onboardingban adod meg.</p>
  <div class="actions">
    <button class="primary" id="installBtn">Runtime telepítése</button>
    <button class="secondary" onclick="window.WebinarMagusDesktop.retryRuntime()">Újraellenőrzés</button>
  </div>
  <pre id="installLog" style="margin-top:18px;max-height:190px;overflow:auto;white-space:pre-wrap;color:#5A6779;font-size:11px"></pre>
</div>
<script>
const btn=document.getElementById('installBtn')
const status=document.getElementById('installStatus')
const log=document.getElementById('installLog')
window.WebinarMagusDesktop.onInstallLog(({line})=>{ log.textContent += line; log.scrollTop=log.scrollHeight })
btn.addEventListener('click', async ()=>{
  btn.disabled=true
  status.textContent='A Webinár Mágus runtime telepítése folyamatban…'
  const result=await window.WebinarMagusDesktop.installRuntime()
  if(result?.ok) return
  btn.disabled=false
  if(result?.reason==='homebrew-required'){
    status.textContent='A telepítéshez Homebrew szükséges.'
    const hb=document.createElement('button')
    hb.className='secondary'
    hb.textContent='Homebrew megnyitása'
    hb.onclick=()=>window.WebinarMagusDesktop.openHomebrew()
    document.querySelector('.actions').appendChild(hb)
  } else {
    status.textContent='A telepítés nem fejeződött be. Próbáld újra.'
  }
})
</script></body></html>
