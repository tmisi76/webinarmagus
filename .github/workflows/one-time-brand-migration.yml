name: one-time-brand-migration

on:
  push:
    branches:
      - webinar-magus-remove-marveen

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[brand-migration]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: webinar-magus-remove-marveen
          fetch-depth: 0
      - name: Apply repository-wide brand migration
        run: python3 scripts/one-time-brand-migration.py
      - name: Verify legacy references are gone
        run: bash scripts/check-brand-hygiene.sh
      - name: Commit migration
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No migration changes needed."
            exit 0
          fi
          git config user.name "Webinár Mágus CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "refactor: finish repository-wide brand migration [brand-migration]"
          git push origin HEAD:webinar-magus-remove-marveen
