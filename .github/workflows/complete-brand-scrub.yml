name: Complete Webinár Mágus rebrand

on:
  push:
    branches:
      - fix/complete-webinar-magus-rebrand

permissions:
  contents: write

jobs:
  scrub-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Complete legacy brand scrub
        run: node scripts/complete-brand-scrub.mjs

      - name: Install dependencies
        run: npm ci

      - name: Stub the claude binary for PATH resolution
        shell: bash
        run: |
          sudo install -m 755 /dev/stdin /usr/local/bin/claude <<'EOF'
          #!/bin/sh
          echo "claude CI stub: tests must not execute this binary" >&2
          exit 1
          EOF

      - name: Typecheck
        run: npm run typecheck

      - name: Syntax check
        run: npm run syntax-check

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify no Marveen references remain
        shell: bash
        run: |
          if git grep -In -i marveen -- ':!LICENSE' ; then
            echo "Legacy Marveen reference remains."
            exit 1
          fi
          if find . -path './.git' -prune -o -iname '*marveen*' -print | grep -q . ; then
            echo "Legacy Marveen path remains."
            find . -path './.git' -prune -o -iname '*marveen*' -print
            exit 1
          fi

      - name: Commit scrubbed repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "refactor: remove all Marveen legacy identifiers"
          git push origin HEAD:fix/complete-webinar-magus-rebrand
