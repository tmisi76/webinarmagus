name: runtime-bundle

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'cli/**'
      - '.claude-plugin/**'
      - 'install-macos.sh'
      - 'install-linux.sh'
      - 'scripts/start.sh'
      - 'scripts/migrate-legacy-brand-state.sh'
      - 'scripts/build-runtime-bundle.sh'
      - 'scripts/update-runtime-bundle.sh'
      - 'update.sh'
      - 'src/web/update-checker.ts'
      - 'src/web/routes/updates.ts'
      - '.github/workflows/runtime-bundle.yml'
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write
  actions: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell installer syntax
        run: |
          bash -n cli/install.sh
          bash -n install-macos.sh
          bash -n install-linux.sh
          bash -n scripts/start.sh
          bash -n scripts/migrate-legacy-brand-state.sh
          bash -n scripts/update-runtime-bundle.sh
          bash -n update.sh

      - name: Validate PowerShell installer syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          foreach ($file in @('cli/install.ps1', 'install-windows.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Error "PowerShell parse failed: $file"
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }

      - name: Build runtime bundle
        run: bash scripts/build-runtime-bundle.sh

      - name: Validate installer payload
        run: |
          test -s release-cli/webinar-magus-runtime.tar.gz
          test -s release-cli/webinar-magus-runtime.tar.gz.sha256
          test -s release-cli/version.json
          node -e "const v=require('./release-cli/version.json').version; if (!v) process.exit(1)"
          mkdir -p /tmp/wm-check
          tar -xzf release-cli/webinar-magus-runtime.tar.gz -C /tmp/wm-check
          test -f /tmp/wm-check/install.sh
          test -f /tmp/wm-check/install-macos.sh
          test -f /tmp/wm-check/install-linux.sh
          test -f /tmp/wm-check/package.json
          test -f /tmp/wm-check/scripts/update-runtime-bundle.sh
          test -f /tmp/wm-check/scripts/migrate-legacy-brand-state.sh
          test -f /tmp/wm-check/.claude-plugin/marketplace.json
          node - <<'NODE'
          const fs = require('fs')
          const m = JSON.parse(fs.readFileSync('/tmp/wm-check/.claude-plugin/marketplace.json', 'utf8'))
          if (m.name !== 'webinarmagus-marketplace') process.exit(1)
          const names = new Set((m.plugins || []).map(p => p.name))
          if (!names.has('slack-channel') || !names.has('teams')) process.exit(1)
          NODE
          grep -q 'PLUGIN_MARKETPLACE="tmisi76/webinarmagus"' /tmp/wm-check/install-macos.sh
          grep -q 'PLUGIN_MARKETPLACE="tmisi76/webinarmagus"' /tmp/wm-check/install-linux.sh
          ! test -e /tmp/wm-check/.git
          ! test -e /tmp/wm-check/.env
          ! test -e /tmp/wm-check/node_modules
          ! test -e /tmp/wm-check/store

      - name: Publish runtime bundle
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          OIDC_RESPONSE="$(curl --fail-with-body --retry 3 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=autowebinar-webinar-magus-release")"
          RELEASE_TOKEN="$(printf '%s' "$OIDC_RESPONSE" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).value||''))")"
          test -n "$RELEASE_TOKEN" || (echo "GitHub OIDC token request failed" && exit 1)
          echo "::add-mask::$RELEASE_TOKEN"

          VERSION="${GITHUB_REF_NAME}"
          BASE="https://tukdmrhhyutiiwpvzsjp.supabase.co/functions/v1/webinar-magus-release"
          for NAME in webinar-magus-runtime.tar.gz webinar-magus-runtime.tar.gz.sha256 version.json; do
            curl --fail-with-body --retry 3 \
              -X PUT \
              -H "Authorization: Bearer $RELEASE_TOKEN" \
              --upload-file "release-cli/$NAME" \
              "$BASE/$VERSION/$NAME"
            curl --fail-with-body --retry 3 \
              -X PUT \
              -H "Authorization: Bearer $RELEASE_TOKEN" \
              --upload-file "release-cli/$NAME" \
              "$BASE/latest/$NAME"
          done

      - name: Dispatch public CLI smoke test
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_VERSION="${GITHUB_REF_NAME#v}"
          gh workflow run cli-release-smoke.yml \
            --ref main \
            -f expected_version="$EXPECTED_VERSION"
          echo "cli-release-smoke dispatched for $EXPECTED_VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: webinar-magus-runtime
          path: |
            release-cli/webinar-magus-runtime.tar.gz
            release-cli/webinar-magus-runtime.tar.gz.sha256
            release-cli/version.json
