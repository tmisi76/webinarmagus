name: cli-release-smoke

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: 'Published runtime version, without the v prefix'
        required: true
        type: string

permissions:
  contents: read

jobs:
  public-install-surface:
    runs-on: ubuntu-latest
    steps:
      - name: Validate expected version
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid expected_version: $EXPECTED_VERSION"
            exit 1
          fi

      - name: Wait for public release propagation
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          set -euo pipefail
          BASE="https://autowebinar.hu"
          VERSION_URL="$BASE/downloads/webinar-magus/latest/version.json"

          ACTUAL=""
          for i in $(seq 1 24); do
            BODY="$(curl --fail --location --silent --show-error \
              --retry 2 --retry-delay 2 --retry-all-errors \
              "$VERSION_URL" || true)"
            ACTUAL="$(printf '%s' "$BODY" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).version||'')}catch{}})")"
            if [ "$ACTUAL" = "$EXPECTED_VERSION" ]; then
              echo "Public latest is $ACTUAL"
              break
            fi
            echo "Waiting for latest=$EXPECTED_VERSION (currently: ${ACTUAL:-unavailable}) [$i/24]"
            sleep 5
          done

          if [ "$ACTUAL" != "$EXPECTED_VERSION" ]; then
            echo "::error::Public latest did not reach $EXPECTED_VERSION (last: ${ACTUAL:-unavailable})"
            exit 1
          fi

          for URL in \
            "$BASE/webinar-magus/install" \
            "$BASE/webinar-magus/install.ps1" \
            "$BASE/downloads/webinar-magus/latest/webinar-magus-runtime.tar.gz" \
            "$BASE/downloads/webinar-magus/latest/webinar-magus-runtime.tar.gz.sha256"
          do
            echo "Checking $URL"
            curl --fail --location --silent --show-error \
              --retry 12 --retry-delay 5 --retry-all-errors \
              "$URL" -o /dev/null
          done

      - name: Verify public bootstrap scripts
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 https://autowebinar.hu/webinar-magus/install -o /tmp/install.sh
          curl -fsSL --retry 5 https://autowebinar.hu/webinar-magus/install.ps1 -o /tmp/install.ps1
          bash -n /tmp/install.sh
          grep -q 'WEBINAR_MAGUS_CLI_BOOTSTRAP=1' /tmp/install.sh
          grep -q 'WEBINAR_MAGUS_CLI_BOOTSTRAP=1' /tmp/install.ps1
          grep -q 'Webinár Mágus' /tmp/install.sh
          grep -q 'Webinár Mágus' /tmp/install.ps1

      - name: Verify published runtime and checksum
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          set -euo pipefail
          BASE="https://autowebinar.hu/downloads/webinar-magus/latest"
          curl -fsSL --retry 5 "$BASE/version.json" -o /tmp/version.json
          curl -fsSL --retry 5 "$BASE/webinar-magus-runtime.tar.gz" -o /tmp/runtime.tar.gz
          curl -fsSL --retry 5 "$BASE/webinar-magus-runtime.tar.gz.sha256" -o /tmp/runtime.tar.gz.sha256

          node - <<'NODE'
          const fs = require('fs')
          const version = JSON.parse(fs.readFileSync('/tmp/version.json', 'utf8')).version
          const expected = process.env.EXPECTED_VERSION
          if (version !== expected) {
            console.error('Unexpected published version:', version, 'expected:', expected)
            process.exit(1)
          }
          console.log('Published version:', version)
          NODE

          EXPECTED="$(awk '{print $1}' /tmp/runtime.tar.gz.sha256 | tr -d '[:space:]')"
          ACTUAL="$(sha256sum /tmp/runtime.tar.gz | awk '{print $1}')"
          test -n "$EXPECTED"
          test "$EXPECTED" = "$ACTUAL"

          rm -rf /tmp/runtime-check
          mkdir -p /tmp/runtime-check
          tar -xzf /tmp/runtime.tar.gz -C /tmp/runtime-check

          test -f /tmp/runtime-check/install.sh
          test -f /tmp/runtime-check/install-macos.sh
          test -f /tmp/runtime-check/install-linux.sh
          test -f /tmp/runtime-check/update.sh
          test -f /tmp/runtime-check/package.json
          test -f /tmp/runtime-check/scripts/ai-provider-runtime.mjs
          test -f /tmp/runtime-check/scripts/install-ai-provider-bridge.sh
          test -f /tmp/runtime-check/scripts/migrate-legacy-brand-state.sh
          test -f /tmp/runtime-check/.claude-plugin/marketplace.json
          test -f /tmp/runtime-check/web/ai-provider-onboarding.js
          test -f /tmp/runtime-check/web/icons/webinar-magus.svg

          bash -n /tmp/runtime-check/install.sh
          bash -n /tmp/runtime-check/install-macos.sh
          bash -n /tmp/runtime-check/install-linux.sh
          bash -n /tmp/runtime-check/scripts/start.sh
          bash -n /tmp/runtime-check/scripts/migrate-legacy-brand-state.sh
          bash -n /tmp/runtime-check/update.sh

          node - <<'NODE'
          const fs = require('fs')
          const m = JSON.parse(fs.readFileSync('/tmp/runtime-check/.claude-plugin/marketplace.json', 'utf8'))
          if (m.name !== 'webinarmagus-marketplace') process.exit(1)
          const names = new Set((m.plugins || []).map(p => p.name))
          if (!names.has('slack-channel') || !names.has('teams')) process.exit(1)
          NODE
          grep -q 'PLUGIN_MARKETPLACE="tmisi76/webinarmagus"' /tmp/runtime-check/install-macos.sh
          grep -q 'PLUGIN_MARKETPLACE="tmisi76/webinarmagus"' /tmp/runtime-check/install-linux.sh

          ! test -e /tmp/runtime-check/.git
          ! test -e /tmp/runtime-check/.env
          ! test -e /tmp/runtime-check/node_modules
          ! test -e /tmp/runtime-check/store

          node - <<'NODE'
          const fs = require('fs')
          const pub = JSON.parse(fs.readFileSync('/tmp/version.json', 'utf8')).version
          const pkg = JSON.parse(fs.readFileSync('/tmp/runtime-check/package.json', 'utf8')).version
          if (pub !== pkg) {
            console.error('Runtime package version mismatch:', pkg, 'published:', pub)
            process.exit(1)
          }
          NODE

      - name: Verify public release branding
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Webinár Mágus' /tmp/runtime-check/web/manifest.json
          grep -q '#2563EB' /tmp/runtime-check/web/style.css
          grep -q '#0EA5E9' /tmp/runtime-check/web/style.css

          LEGACY_MATCHES="$(
            grep -RIlE \
              'Mar[v]een|MARV[E]EN_|/api/mar[v]een|mar[v]een-marketplace|Marv[i]n|Malv[i]n|tmisi76/webinar-magus' \
              /tmp/runtime-check 2>/dev/null || true
          )"
          if [ -n "$LEGACY_MATCHES" ]; then
            echo "::error::Legacy brand/repository references found in published runtime:"
            echo "$LEGACY_MATCHES"
            exit 1
          fi
