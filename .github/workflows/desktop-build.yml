name: desktop-build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-build.yml'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Build unsigned PR/test DMG
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac -- --config.mac.notarize=false

      - name: Build, sign and notarize release DMG
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$CSC_LINK" || (echo "Missing MAC_CSC_LINK" && exit 1)
          test -n "$CSC_KEY_PASSWORD" || (echo "Missing MAC_CSC_KEY_PASSWORD" && exit 1)
          test -n "$APPLE_ID" || (echo "Missing APPLE_ID" && exit 1)
          test -n "$APPLE_APP_SPECIFIC_PASSWORD" || (echo "Missing APPLE_APP_SPECIFIC_PASSWORD" && exit 1)
          test -n "$APPLE_TEAM_ID" || (echo "Missing APPLE_TEAM_ID" && exit 1)
          npm run dist:mac

      - name: Verify signed and notarized release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop
        run: |
          APP_PATH="$(find release -maxdepth 2 -name 'Webinár Mágus.app' -print -quit)"
          test -n "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"

      - uses: actions/upload-artifact@v4
        with:
          name: webinar-magus-macos
          path: desktop/release/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install
      - name: Build EXE
        working-directory: desktop
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: webinar-magus-windows
          path: desktop/release/*.exe
