name: desktop-build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-build.yml'

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Build unsigned PR/test DMG
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac -- --config.mac.notarize=false

      - name: Build, sign and notarize release DMG
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$CSC_LINK" || (echo "Missing MAC_CSC_LINK" && exit 1)
          test -n "$CSC_KEY_PASSWORD" || (echo "Missing MAC_CSC_KEY_PASSWORD" && exit 1)
          test -n "$APPLE_ID" || (echo "Missing APPLE_ID" && exit 1)
          test -n "$APPLE_APP_SPECIFIC_PASSWORD" || (echo "Missing APPLE_APP_SPECIFIC_PASSWORD" && exit 1)
          test -n "$APPLE_TEAM_ID" || (echo "Missing APPLE_TEAM_ID" && exit 1)
          npm run dist:mac

      - name: Verify signed and notarized release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop
        run: |
          APP_PATH="$(find release -maxdepth 2 -name 'Webinár Mágus.app' -print -quit)"
          test -n "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"

      - uses: actions/upload-artifact@v4
        with:
          name: webinar-magus-macos
          path: desktop/release/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install
      - name: Build unsigned PR/test EXE
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win

      - name: Build and sign release EXE
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK)) { throw "Missing WIN_CSC_LINK" }
          if ([string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD)) { throw "Missing WIN_CSC_KEY_PASSWORD" }
          npm run dist:win

      - name: Verify Authenticode signature
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path release -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "Release EXE not found" }
          $sig = Get-AuthenticodeSignature $exe.FullName
          Write-Host "Signature status: $($sig.Status)"
          Write-Host "Signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "Invalid Authenticode signature: $($sig.Status)" }

      - uses: actions/upload-artifact@v4
        with:
          name: webinar-magus-windows
          path: desktop/release/*.exe


  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: webinar-magus-macos
          path: release/macos

      - uses: actions/download-artifact@v4
        with:
          name: webinar-magus-windows
          path: release/windows

      - name: Generate SHA-256 checksums
        run: |
          find release -type f \( -name '*.dmg' -o -name '*.exe' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum > release/SHA256SUMS.txt
          cat release/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t FILES < <(find release -type f \( -name '*.dmg' -o -name '*.exe' -o -name 'SHA256SUMS.txt' \) | sort)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${FILES[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${FILES[@]}" \
              --title "Webinár Mágus $GITHUB_REF_NAME" \
              --generate-notes
          fi
